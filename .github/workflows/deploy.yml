name: Deploy PixRecorder

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Upload Website
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ FTP_host03.loswebos.de }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: www/htdocs/pixrecorder/